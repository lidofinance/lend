[profile.default]
libs = ["lib"]
names = true
sizes = true
via_ir = false
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
solc = "0.8.36"
evm_version = "cancun"

[fuzz]
runs = 4096

[profile.default.invariant]
runs = 1024
depth = 32
fail_on_revert = true

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "unaliased-plain-import",
    "asm-keccak256",
    "unwrapped-modifier-logic",
]
ignore = [
    'test/**/*.sol'
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config
